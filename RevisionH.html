<!--
  Pestaña 3 de la consola. Se inyecta dentro de ConsolaH.html.

  DOS REGLAS que hay que respetar al tocar este archivo:
    1. Todos los id llevan prefijo "rev-". Comparte documento con las otras
       pestañas y un id repetido hace que getElementById devuelva el de la
       pestaña equivocada. Ya pasó una vez y costó encontrarlo.
    2. Todos los selectores CSS cuelgan de #t3, para no reestilar las otras
       pestañas sin querer.
  Los colores salen de los tokens que define ConsolaH.html.
-->
<style>
  #t3 .revbar{display:flex;gap:26px;padding:14px 22px;border-bottom:1px solid var(--line);background:var(--panel)}
  #t3 .kpi b{display:block;font-size:20px;font-weight:650;font-variant-numeric:tabular-nums;line-height:1.15}
  #t3 .kpi span{font-size:11px;color:var(--faint)}

  #t3 .app{display:grid;grid-template-columns:296px 1fr;min-height:calc(100vh - 190px)}
  #t3 .panel-izq{border-right:1px solid var(--line);background:var(--panel);overflow-y:auto;max-height:calc(100vh - 190px)}
  #t3 .panel-der{padding:22px 26px 80px;max-width:1000px}

  #t3 .filtro-sel{padding:10px 12px 0}
  #t3 .filtro-sel select{width:100%;font:inherit;font-size:13px;padding:6px 8px;
    border:1px solid var(--line);border-radius:6px;background:transparent;color:inherit}
  #t3 .contexto{font-size:11.5px;color:var(--faint);align-self:center;margin-left:22px;max-width:420px}
  #t3 .nada .salto{margin-top:10px;border:1px solid var(--line);background:transparent;
    color:var(--acc);padding:6px 12px;border-radius:7px;font-size:12px;font-weight:600;cursor:pointer}
  #t3 .nada .salto:hover{border-color:var(--acc)}
  #t3 .global{font-size:11px;color:var(--faint);margin:0 0 10px}
  #t3 .filtros{display:flex;gap:6px;padding:12px 12px 10px;border-bottom:1px solid var(--line);
               position:sticky;top:0;background:var(--panel);z-index:5}
  #t3 .filtros button{flex:1;padding:6px 4px;border:1px solid var(--line);background:transparent;
                      color:var(--soft);border-radius:7px;font-size:12px}
  #t3 .filtros button.on{background:var(--acc-bg);border-color:var(--acc);color:var(--acc);font-weight:600}

  #t3 .item{padding:11px 14px;border-bottom:1px solid var(--line);cursor:pointer;display:flex;gap:10px;align-items:flex-start}
  #t3 .item:hover{background:var(--bg)}
  #t3 .item.sel{background:var(--acc-bg);box-shadow:inset 3px 0 0 var(--acc)}
  #t3 .item .id{font-weight:600;font-variant-numeric:tabular-nums;font-size:13px}
  #t3 .item .meta{font-size:11.5px;color:var(--faint);margin-top:2px}
  #t3 .dot{width:8px;height:8px;border-radius:50%;margin-top:6px;flex:0 0 8px}
  #t3 .dot.done{background:var(--ok)} #t3 .dot.todo{background:var(--warn)}

  #t3 .tarjeta{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:18px 20px;margin-bottom:16px}
  #t3 .titulo{display:flex;flex-wrap:wrap;align-items:baseline;gap:12px;margin-bottom:12px}
  #t3 .titulo h2{font-size:20px;font-weight:650;font-variant-numeric:tabular-nums;margin:0}
  #t3 .chips{display:flex;flex-wrap:wrap;gap:6px}
  #t3 .chip{font-size:11px;padding:3px 9px;border-radius:20px;background:var(--na-bg);color:var(--na);font-weight:600}
  #t3 .chip.nota{background:var(--acc-bg);color:var(--acc)}

  #t3 .datos{display:grid;grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:11px 18px;font-size:12.5px}

  #t3 .datos div b{font-weight:500;word-break:break-all}

  #t3 .puntaje{display:flex;flex-wrap:wrap;gap:26px;align-items:flex-start;

  #t3 .puntaje .nota{font-size:42px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums;color:var(--acc)}

  #t3 details.conv pre{margin:0;padding:0 20px 18px;white-space:pre-wrap;word-break:break-word;

  #t3 .crit{border:1px solid var(--line);border-radius:var(--r);background:var(--panel);margin-bottom:8px;overflow:hidden}

  #t3 .ctxt{font-size:13.5px}
  #t3 .ccrit{display:inline-block;font-size:10px;font-weight:700;letter-spacing:.06em;color:var(--bad);
             background:var(--bad-bg);padding:1px 6px;border-radius:4px;margin-left:7px;vertical-align:1px}
  #t3 .cita{margin-top:7px;font-size:12.5px;color:var(--soft);border-left:2px solid var(--line);

  #t3 .cmeta{margin-top:6px;font-size:11.5px;color:var(--faint)}
  #t3 .ver{font-size:11px;font-weight:700;padding:3px 10px;border-radius:20px;white-space:nowrap}
  #t3 .v-cumple{background:var(--ok-bg);color:var(--ok)}
  #t3 .v-no_cumple{background:var(--bad-bg);color:var(--bad)}

  #t3 .v-no_aplica{background:var(--na-bg);color:var(--na)}

  #t3 .acc{display:flex;flex-direction:column;gap:7px;align-items:flex-end}
  #t3 .marcar{border:1px solid var(--line);background:transparent;color:var(--soft);
              padding:5px 12px;border-radius:7px;font-size:12px;white-space:nowrap}
  #t3 .marcar:hover{border-color:var(--bad);color:var(--bad)}
  #t3 .crit.dis .marcar{background:var(--bad-bg);border-color:var(--bad);color:var(--bad);font-weight:600}

  #t3 .detalle{display:none;padding:14px 16px 15px 118px;border-top:1px solid var(--line)}
  #t3 .crit.dis .detalle{display:block}
  #t3 .campo{margin-bottom:11px}
  #t3 .campo label{display:block;font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;
                   color:var(--faint);margin-bottom:5px}
  #t3 select,#t3 textarea{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:7px;
    background:var(--bg);color:var(--ink);font:inherit;font-size:13px}

  #t3 .cierre{position:sticky;bottom:0;background:var(--panel);border:1px solid var(--line);
              border-radius:var(--r);padding:16px 20px;margin-top:18px;box-shadow:var(--sombra-alta)}
  #t3 .opts{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
  #t3 .opt{padding:8px 17px;border:1px solid var(--line);border-radius:7px;background:transparent;
           color:var(--soft);font-size:13px}
  #t3 .opt.on{font-weight:650}
  #t3 .opt[data-v=correcta].on{background:var(--ok-bg);border-color:var(--ok);color:var(--ok)}

  #t3 .opt[data-v=incorrecta].on{background:var(--bad-bg);border-color:var(--bad);color:var(--bad)}
  #t3 .pie{display:flex;align-items:center;gap:16px;margin-top:12px;flex-wrap:wrap}
  #t3 .aviso{font-size:12.5px;color:var(--faint)}
  #t3 .aviso.ok{color:var(--ok)} #t3 .aviso.err{color:var(--bad)}

  /* Motivo por el que un criterio no aplica a ESTE ticket. */
  #t3 .deotro{margin-top:7px;font-size:11.5px;color:var(--warn);background:var(--warn-bg);

  #t3 .deotro b{color:inherit}
  #t3 .nomotivo{margin-top:7px;font-size:11.5px;color:var(--na);background:var(--na-bg);
                border-radius:6px;padding:6px 9px;line-height:1.45}
  #t3 .nomotivo b{color:inherit}

  /* Ranking de lo que más falla el modelo. Ya se calculaba y no se mostraba. */
  #t3 .rank{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);
            padding:18px 20px;text-align:left}
  #t3 .rank h3{font-size:14px;font-weight:650;margin:0 0 4px}
  #t3 .rank p{font-size:12.5px;color:var(--faint);margin:0 0 14px;line-height:1.5}
  #t3 .rank table{width:100%;border-collapse:collapse;font-size:12.5px}
  #t3 .rank th{text-align:left;font-size:10.5px;letter-spacing:.05em;text-transform:uppercase;
               color:var(--faint);font-weight:600;padding:6px 8px;border-bottom:1px solid var(--line)}
  #t3 .rank td{padding:6px 8px;border-bottom:1px solid var(--line);vertical-align:top}
  #t3 .rank td.n{text-align:right;font-variant-numeric:tabular-nums;font-weight:600}
  #t3 .rank .cid2{font:600 12px var(--mono)}
  #t3 .rank .tipos{display:flex;gap:5px;flex-wrap:wrap}
  #t3 .rank .tp{font-size:10.5px;font-weight:600;padding:1px 7px;border-radius:20px;white-space:nowrap}
  #t3 .rank .tp.regla{background:var(--warn-bg);color:var(--warn)}

  #t3 .nada{color:var(--faint);padding:56px 20px;text-align:center;font-size:13.5px}

  @media (max-width:900px){
    #t3 .app{grid-template-columns:1fr}
    #t3 .panel-izq{max-height:290px}
    #t3 .detalle{padding-left:16px}
  }
</style>

<div class="revbar">
  <div class="kpi"><b id="rev-k-pend">–</b><span>por revisar</span></div>
  <div class="kpi"><b id="rev-k-rev">–</b><span>revisadas</span></div>
  <div class="kpi"><b id="rev-k-acu">–</b><span>acuerdo con el agente</span></div>
  <div class="contexto" id="rev-contexto"></div>
  <div style="margin-left:auto;align-self:center" id="rev-masivo">
    <button class="rehacer" id="rev-borrar-todo">Borrar todas las auditorías</button>
  </div>
</div>

<div class="app">
  <div class="panel-izq">
    <div class="filtro-sel" id="rev-caja-aud" style="display:none">
      <select id="rev-aud"><option value="">Todas las audiencias</option></select>
    </div>
    <div class="filtro-sel">
      <select id="rev-semana" title="Semana en que el motor auditó el ticket"></select>
    </div>
    <div class="filtro-sel" id="rev-caja-agente" style="display:none">
      <select id="rev-agente"><option value="">Todos los ejecutivos</option></select>
    </div>
    <div class="filtros">
      <button data-f="pendientes" class="on">Por revisar</button>
      <button data-f="revisados">Revisadas</button>
      <button data-f="todos">Todas</button>
    </div>
    <div id="rev-lista"><div class="nada">Cargando…</div></div>
  </div>

  <div class="panel-der" id="rev-main">
    <div class="nada">Elige un ticket de la lista para empezar.</div>
  </div>
</div>

<script>
(function(){
  var TICKETS = [], FILTRO = 'pendientes', ACTUAL = null, ESTADO = {}, CARGADO = false;
  // '' = todas las semanas · 'yyyy-mm-dd' = el lunes de esa semana · 'sin' = sin fecha.
  // Arranca en la semana en curso, que es lo que se pidió: la pestaña es una
  // cola de trabajo, y la pregunta de todos los lunes es qué queda de esta semana.
  var SEMANA = lunesDe(hoyISO());
  var AGENTE = '';
  var RESUMEN = null;
  // Audiencia elegida en ESTA pestaña. Arranca con la de la cabecera de la
  // consola, si hay una puesta: quien filtró arriba no espera que el paso 3
  // le muestre otra cosa.
  var AUD = '';

  function $(id){ return document.getElementById(id); }
  function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
  function txt(e){ return e && e.message ? e.message : String(e); }

  // ---------- semanas ----------
  //
  // Las fechas se construyen SIEMPRE con números, nunca con new Date(cadena):
  // "2026-09-14" se interpreta como UTC y en Chile eso es el 13 por la noche,
  // así que media semana se correría un día sin que nadie lo notara.
  function hoyISO(){
    var d = new Date(), p = function(n){ return (n < 10 ? '0' : '') + n; };
    return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate());
  }

  // El lunes de la semana de esa fecha. Misma convención que el servidor y que
  // la pestaña de Resultados: lunes a domingo.
  function lunesDe(iso){
    var p = String(iso).split('-');
    var d = new Date(Number(p[0]), Number(p[1]) - 1, Number(p[2]));
    if (isNaN(d)) return '';
    d.setDate(d.getDate() - ((d.getDay() + 6) % 7));
    var z = function(n){ return (n < 10 ? '0' : '') + n; };
    return d.getFullYear() + '-' + z(d.getMonth() + 1) + '-' + z(d.getDate());
  }

  var MES = ['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];

  // "8 – 14 sep", o "29 sep – 5 oct" cuando la semana cambia de mes.
  function etiquetaSemana(lunes){
    var p = String(lunes).split('-');
    var a = new Date(Number(p[0]), Number(p[1]) - 1, Number(p[2]));
    var b = new Date(a.getTime()); b.setDate(b.getDate() + 6);
    var hoy = lunesDe(hoyISO());
    var pre = lunes === hoy ? 'Esta semana · '
            : (lunes === lunesDe(restar7(hoy)) ? 'Semana pasada · ' : '');
    return pre + (a.getMonth() === b.getMonth()
      ? a.getDate() + ' – ' + b.getDate() + ' ' + MES[b.getMonth()]
      : a.getDate() + ' ' + MES[a.getMonth()] + ' – ' + b.getDate() + ' ' + MES[b.getMonth()]);
  }

  function restar7(iso){
    var p = String(iso).split('-');
    var d = new Date(Number(p[0]), Number(p[1]) - 1, Number(p[2]));
    d.setDate(d.getDate() - 7);
    var z = function(n){ return (n < 10 ? '0' : '') + n; };
    return d.getFullYear() + '-' + z(d.getMonth() + 1) + '-' + z(d.getDate());
  }

  // ---------- una llamada no se pisa a sí misma ----------
  //
  // Volver a esta pestaña relanzaba la lista y el resumen cada vez, aunque la
  // vez anterior siguiera en el aire. Cuando el servidor va lento la pantalla
  // no pinta nada, uno vuelve a hacer clic, y cada clic agrega dos llamadas
  // más a una cola que ya no avanza: en el registro de una tarde se ven
  // dieciséis revResumen en tres minutos, ninguno terminado.
  //
  // La segunda no se descarta: se guarda y sale cuando vuelve la primera.
  var ENVUELO = {};

  function pedir(nombre, args, ok, fail){
    if (ENVUELO[nombre]){ ENVUELO[nombre].repetir = { args: args || [], ok: ok, fail: fail }; return; }
    lanzar(nombre, args || [], ok, fail);
  }

  function lanzar(nombre, args, ok, fail){
    ENVUELO[nombre] = { repetir: null };
    var fin = function(){
      var r = ENVUELO[nombre] && ENVUELO[nombre].repetir;
      delete ENVUELO[nombre];
      if (r) lanzar(nombre, r.args, r.ok, r.fail);
    };
    var run = google.script.run
      .withSuccessHandler(function(x){ fin(); if (ok) ok(x); })
      .withFailureHandler(function(e){ fin(); if (fail) fail(e); });
    run[nombre].apply(run, args);
  }

  // ---------- carga ----------
  //
  // UNA llamada para la lista y el resumen. Antes eran dos, y cada una abría su
  // propia ejecución en el servidor releyendo los mismos veredictos.
  function cargar(){
    pedir('revAbrir', [], function(r){
      TICKETS = (r && r.lista) || []; CARGADO = true; armarSelectores(); pintarLista();
      if (r && r.resumen) pintarResumen(r.resumen);
    }, function(e){
      // El error se muestra en LOS DOS paneles: si solo lo pusiéramos en el
      // de la derecha, el de la izquierda se queda en "Cargando…" y parece
      // que la pantalla está colgada.
      var m = '<div class="nada"><b>No pude cargar la lista</b>' + esc(txt(e)) + '</div>';
      $('rev-lista').innerHTML = m;
      $('rev-main').innerHTML  = m;
    });
  }

  function resumen(){
    pedir('revResumen', [], pintarResumen, function(){ /* los contadores no bloquean nada */ });
  }

  function pintarResumen(s){
    (function(){
      // Los tres contadores de arriba YA NO salen de acá: los calcula
      // pintarContadores() sobre la lista visible, para que no puedan
      // contradecirla. De esta llamada solo se usa el ranking, que es una
      // pregunta global —qué criterio calibrar primero— y se rotula como tal.
      RESUMEN = s;
      // El ranking ya lo calculaba el servidor y esta pantalla lo tiraba. Es
      // justo lo que hace falta para decidir qué criterio calibrar primero,
      // así que ocupa el hueco donde antes solo decía "elige un ticket".
      if (!ACTUAL) pintarRanking();
    })();
  }

  function pintarRanking(){
    var s = RESUMEN;
    if (!s || !s.ranking || !s.ranking.length){
      $('rev-main').innerHTML = '<div class="nada">' +
        (s && s.revisados
           ? '<b>Todavía no hay desacuerdos anotados</b>De momento el modelo coincide contigo ' +
             'en todo lo revisado. Elige un ticket de la lista para seguir.'
           : '<b>Elige un ticket de la lista para empezar</b>Cuando marques desacuerdos, acá ' +
             'vas a ver en qué criterios se equivoca más el modelo.') + '</div>';
      return;
    }

    var etq = { regla:'regla', dato:'dato', criterio:'juicio' };
    var h = '<div class="rank"><h3>En qué se equivoca el modelo</h3>' +
      '<p>Los criterios donde más veces has estado en desacuerdo, sobre ' + s.criteriosRevisados +
      ' criterios revisados en ' + s.revisados + ' tickets. ' +
      'El acuerdo global va en ' + (s.acuerdoCriterios === null ? '–' : s.acuerdoCriterios + '%') +
      '.</p>' +
      // Se dice explícitamente, porque justo encima hay tres contadores que SÍ
      // se filtran. Dos porcentajes distintos en la misma pantalla sin decir
      // que miden cosas distintas es como se pierde la confianza en un panel.
      '<p class="global">Esta tabla no se filtra: mira todas las revisiones, de todas las ' +
      'semanas y de todos los ejecutivos. Para calibrar un criterio conviene toda la ' +
      'evidencia, no la de una semana.</p>' +
      '<table><thead><tr><th>Criterio</th><th class="n">Veces</th>' +
      '<th>De qué tipo</th></tr></thead><tbody>';

    s.ranking.forEach(function(r){
      var tipos = ['regla','dato','criterio'].filter(function(k){ return r[k]; })
        .map(function(k){ return '<span class="tp ' + k + '">' + etq[k] + ' ' + r[k] + '</span>'; });
      h += '<tr><td><span class="cid2">' + esc(r.id) + '</span><br>' +
           '<span style="color:var(--faint)">' + esc(r.texto || '') + '</span></td>' +
           '<td class="n">' + r.n + '</td>' +
           '<td><div class="tipos">' + (tipos.join('') || '<span style="color:var(--faint)">—</span>') +
           '</div></td></tr>';
    });

    h += '</tbody></table><div class="pie2">Los tres tipos no se arreglan igual, y por eso se ' +
         'cuentan por separado. <b>Regla</b>: el criterio está mal escrito o le falta un caso — ' +
         'se corrige redactándolo, y con un solo desacuerdo ya hay evidencia suficiente. ' +
         '<b>Dato</b>: le faltó información — no lo arregla ninguna instrucción, hace falta la ' +
         'integración. <b>Juicio</b>: tenía todo y aun así se equivocó — este es el único que ' +
         'necesita varios casos para calibrarlo.</div></div>';
    $('rev-main').innerHTML = h;
  }

  // ---------- lista ----------
  document.querySelectorAll('#t3 .filtros button').forEach(function(b){
    b.onclick = function(){
      document.querySelectorAll('#t3 .filtros button').forEach(function(x){ x.classList.remove('on'); });
      b.classList.add('on'); FILTRO = b.dataset.f; pintarLista();
    };
  });

  // Los selectores se arman con lo que de verdad hay en la lista: si todos los
  // tickets auditados son de una sola audiencia, ese selector no aparece.
  function armarSelectores(){ armarSelectorAud(); armarSelectorSemana(); armarSelectorAgente(); }

  function armarSelectorAud(){
    var vistos = {}, orden = [];
    TICKETS.forEach(function(t){
      var k = t.audiencia || '';
      if (!k || vistos[k]) return;
      vistos[k] = t.audienciaNombre || k; orden.push(k);
    });
    if (orden.length < 2){ $('rev-caja-aud').style.display = 'none'; return; }
    var sel = $('rev-aud');
    sel.innerHTML = '<option value="">Todas las audiencias</option>';
    orden.forEach(function(k){
      var o = document.createElement('option');
      o.value = k; o.textContent = vistos[k];
      sel.appendChild(o);
    });
    sel.value = AUD;
    $('rev-caja-aud').style.display = 'block';
    sel.onchange = function(){ AUD = sel.value; armarSelectorSemana(); armarSelectorAgente(); pintarLista(); };
  }

  // Los tickets de la audiencia elegida. Las opciones de semana y de ejecutivo
  // salen de ACÁ, no de la lista ya filtrada: si las opciones de un selector
  // dependieran del otro, elegir una semana haría desaparecer al ejecutivo que
  // acabas de elegir y el filtro se borraría solo.
  function baseDeOpciones(){
    return TICKETS.filter(function(t){ return !AUD || (t.audiencia || '') === AUD; });
  }

  function armarSelectorSemana(){
    var cuenta = {}, sinFecha = 0;
    baseDeOpciones().forEach(function(t){
      if (!t.semana){ sinFecha++; return; }
      cuenta[t.semana] = (cuenta[t.semana] || 0) + 1;
    });
    var semanas = Object.keys(cuenta).sort().reverse();
    var actual = lunesDe(hoyISO());

    var sel = $('rev-semana');
    var h = '';
    // La semana en curso SIEMPRE está en la lista, tenga o no auditorías. Si
    // apareciera solo cuando hay datos, el selector se quedaría en otra semana
    // y uno creería estar mirando la de hoy.
    if (semanas.indexOf(actual) < 0) semanas.unshift(actual);
    semanas.forEach(function(k){
      h += '<option value="' + k + '">' + esc(etiquetaSemana(k)) +
           '  (' + (cuenta[k] || 0) + ')</option>';
    });
    h += '<option value="">Todas las semanas  (' +
         (baseDeOpciones().length) + ')</option>';
    // Los tickets sin fecha de auditoría no se esconden: se les da su propia
    // opción. Desaparecer sin decir dónde fueron es peor que salir aparte.
    if (sinFecha) h += '<option value="sin">Sin fecha de auditoría  (' + sinFecha + ')</option>';
    sel.innerHTML = h;

    // Si la semana elegida ya no existe como opción, se cae a "todas" en vez
    // de quedarse mostrando una lista vacía sin explicación.
    var hay = Array.prototype.some.call(sel.options, function(o){ return o.value === SEMANA; });
    if (!hay) SEMANA = '';
    sel.value = SEMANA;
    sel.onchange = function(){ SEMANA = sel.value; pintarLista(); };
  }

  function armarSelectorAgente(){
    var cuenta = {};
    baseDeOpciones().forEach(function(t){
      var a = (t.agente || '').trim();
      if (!a) return;
      cuenta[a] = (cuenta[a] || 0) + 1;
    });
    var nombres = Object.keys(cuenta).sort(function(a, b){ return a.localeCompare(b); });
    if (nombres.length < 2){ $('rev-caja-agente').style.display = 'none'; AGENTE = ''; return; }

    var sel = $('rev-agente');
    sel.innerHTML = '<option value="">Todos los ejecutivos  (' + nombres.length + ')</option>' +
      nombres.map(function(a){
        return '<option value="' + esc(a) + '">' + esc(a) + '  (' + cuenta[a] + ')</option>';
      }).join('');
    if (nombres.indexOf(AGENTE) < 0) AGENTE = '';
    sel.value = AGENTE;
    $('rev-caja-agente').style.display = 'block';
    sel.onchange = function(){ AGENTE = sel.value; pintarLista(); };
  }

  // Los tres filtros de arriba, sin el de estado. Es lo que define "el
  // conjunto que estoy mirando", y de acá salen TAMBIÉN los contadores de la
  // cabecera: un contador calculado aparte de su propia lista puede no cuadrar
  // con ella, y esta consola ya pagó ese precio una vez.
  function enAlcance(){
    return TICKETS.filter(function(t){
      if (AUD && (t.audiencia || '') !== AUD) return false;
      if (SEMANA === 'sin'){ if (t.semana) return false; }
      else if (SEMANA && t.semana !== SEMANA) return false;
      if (AGENTE && (t.agente || '').trim() !== AGENTE) return false;
      return true;
    });
  }

  function pintarContadores(alcance){
    var rev = alcance.filter(function(t){ return t.revisado; });
    $('rev-k-pend').textContent = alcance.length - rev.length;
    $('rev-k-rev').textContent  = rev.length;

    var criterios = 0, desac = 0;
    rev.forEach(function(t){ criterios += t.criteriosRevisados || 0; desac += t.desacuerdos || 0; });
    $('rev-k-acu').textContent = criterios
      ? Math.round((criterios - desac) / criterios * 100) + '%' : '–';

    var partes = [];
    if (SEMANA === 'sin') partes.push('sin fecha de auditoría');
    else if (SEMANA) partes.push(etiquetaSemana(SEMANA).replace(' · ', ': '));
    else partes.push('todas las semanas');
    if (AGENTE) partes.push(AGENTE);
    $('rev-contexto').textContent = partes.join(' · ') + ' — ' + alcance.length +
      ' de ' + TICKETS.length + ' auditorías.';
  }

  function pintarLista(){
    var alcance = enAlcance();
    pintarContadores(alcance);

    var l = alcance.filter(function(t){
      if (FILTRO === 'pendientes') return !t.revisado;
      if (FILTRO === 'revisados')  return t.revisado;
      return true;
    });
    var el = $('rev-lista');
    if (!l.length){
      el.innerHTML = TICKETS.length ? vacioConSalida(alcance)
        : '<div class="nada"><b>Todavía no hay nada que revisar</b>' +
          'Acá aparecen los tickets que ya tienen veredicto del agente. ' +
          'Procesa alguno en la pestaña 2.</div>';
      var b = el.querySelector('.salto');
      if (b) b.onclick = function(){
        SEMANA = b.dataset.sem; armarSelectorSemana(); pintarLista();
      };
      return;
    }
    el.innerHTML = l.map(function(t){
      // La audiencia solo se escribe cuando hay más de una: repetir
      // "Aeropuerto" en cada renglón de una lista de puros aeropuertos es
      // ruido que empuja fuera lo que sí distingue a un ticket de otro.
      var pre = ($('rev-caja-aud').style.display !== 'none' && !AUD && t.audienciaNombre)
        ? t.audienciaNombre + ' · ' : '';
      // El ejecutivo se escribe cuando NO se está filtrando por uno: repetir el
      // mismo nombre en cada renglón de una lista de un solo ejecutivo es ruido.
      var quien = (!AGENTE && t.agente) ? t.agente + ' · ' : '';
      var sub = pre + quien + (t.revisado
        ? t.veredictoRevisor + ' · ' + t.desacuerdos + ' en desacuerdo'
        : t.canal + ' · ' + t.criterios + ' criterios' + (t.notaModelo !== '' ? ' · nota ' + t.notaModelo : ''));
      return '<div class="item' + (ACTUAL === t.ticket ? ' sel' : '') + '" data-t="' + esc(t.ticket) + '">' +
             '<div class="dot ' + (t.revisado ? 'done' : 'todo') + '"></div>' +
             '<div><div class="id">' + esc(t.ticket) + '</div>' +
             '<div class="meta">' + esc(sub) + '</div></div></div>';
    }).join('');
    el.querySelectorAll('.item').forEach(function(d){
      d.onclick = function(){ abrir(d.dataset.t); };
    });
  }

  /**
   * Una lista vacía tiene que decir POR QUÉ está vacía y qué hacer.
   *
   * "Nada en esta vista" delante de un filtro puesto en la semana en curso un
   * lunes por la mañana se lee como que el sistema se rompió. Acá se distingue
   * el filtro de semana del de estado, y cuando hay trabajo en otra semana se
   * ofrece saltar a ella de un clic.
   */
  function vacioConSalida(alcance){
    if (alcance.length){
      // Hay tickets en esta semana; lo que está vacío es el filtro de estado.
      return '<div class="nada">Nada ' +
        (FILTRO === 'pendientes' ? 'por revisar' : 'revisado') +
        ' en esta vista. Hay ' + alcance.length + ' en total — prueba "Todas".</div>';
    }
    // Ni un ticket en esta combinación. ¿Hay trabajo en otra semana?
    var otras = {};
    TICKETS.forEach(function(t){
      if (AUD && (t.audiencia || '') !== AUD) return;
      if (AGENTE && (t.agente || '').trim() !== AGENTE) return;
      if (t.semana) otras[t.semana] = (otras[t.semana] || 0) + 1;
    });
    var ks = Object.keys(otras).sort().reverse();
    var que = (SEMANA === 'sin' ? 'sin fecha de auditoría' :
               SEMANA ? etiquetaSemana(SEMANA).replace(/^.*· /, '') : 'este filtro') +
              (AGENTE ? ', ' + AGENTE : '');
    if (!ks.length)
      return '<div class="nada"><b>Nada para ' + esc(que) + '</b>' +
             'No hay auditorías que cumplan este filtro.</div>';
    return '<div class="nada"><b>Nada para ' + esc(que) + '</b>' +
           'La auditoría más reciente es de ' + esc(etiquetaSemana(ks[0]).replace(/^.*· /, '')) +
           ' (' + otras[ks[0]] + ').' +
           '<button class="salto" data-sem="' + ks[0] + '">Ver esa semana</button></div>';
  }

  // ---------- ticket ----------
  //
  // ADELANTAR EL SIGUIENTE.
  //
  // Buscar un ticket obliga a recorrer una columna entera de la hoja de
  // veredictos, y eso no lo arregla ningún truco: es lo que cuesta buscar sin
  // índice. Lo que sí se puede es hacerlo ANTES, mientras la persona lee.
  //
  // Revisar un ticket toma minutos; traerlo, segundos. Durante esos minutos el
  // servidor está parado. Así que al terminar de pintar uno se pide en silencio
  // el siguiente de la lista, y cuando la persona hace clic ya está acá.
  //
  // Dos cuidados: el adelanto NO usa el guardia de llamadas —así nunca puede
  // dejar esperando a un clic de verdad— y no se lanza si hay algo en vuelo.
  var CACHE_TK = {}, ORDEN_TK = [], ADELANTANDO = null;
  var TOPE_CACHE = 8;

  function guardarEnCache(t, d){
    if (!CACHE_TK[t]) ORDEN_TK.push(t);
    CACHE_TK[t] = d;
    while (ORDEN_TK.length > TOPE_CACHE) delete CACHE_TK[ORDEN_TK.shift()];
  }

  function olvidarDeCache(t){
    delete CACHE_TK[t];
    ORDEN_TK = ORDEN_TK.filter(function(x){ return x !== t; });
  }

  function abrir(ticket){
    ACTUAL = ticket; pintarLista();

    if (CACHE_TK[ticket]){          // ya lo habíamos adelantado: sale al instante
      pintar(CACHE_TK[ticket]);
      adelantarSiguiente();
      return;
    }

    $('rev-main').innerHTML = '<div class="nada">Cargando ticket…</div>';
    // Hacer clic en cuatro tickets seguidos lanzaba cuatro cargas en paralelo
    // y pintaba la que volviera última, que no tiene por qué ser la que se
    // pidió al final. Acá sale una, y al volver sale la última pedida.
    pedir('revCargarTicket', [ticket], function(d){
      if (!d) return;
      guardarEnCache(d.ticket, d);
      if (d.ticket !== ACTUAL) return;   // se cambió de ticket mientras cargaba
      pintar(d);
      adelantarSiguiente();
    }, function(e){
      $('rev-main').innerHTML = '<div class="nada"><b>No pude abrir el ticket</b>' + esc(txt(e)) + '</div>';
    });
  }

  // El siguiente de la lista VISIBLE, que es el que la persona va a abrir.
  function siguienteDeLaLista(){
    var l = [];
    document.querySelectorAll('#rev-lista .item').forEach(function(d){ l.push(d.dataset.t); });
    var i = l.indexOf(ACTUAL);
    if (i < 0) return null;
    for (var k = i + 1; k < l.length; k++) if (!CACHE_TK[l[k]]) return l[k];
    return null;
  }

  function adelantarSiguiente(){
    if (Object.keys(ENVUELO).length) return;    // hay algo en vuelo: no estorbar
    var t = siguienteDeLaLista();
    if (!t || t === ADELANTANDO) return;
    ADELANTANDO = t;
    google.script.run
      .withSuccessHandler(function(d){
        ADELANTANDO = null;
        if (d && d.ticket) guardarEnCache(d.ticket, d);
      })
      .withFailureHandler(function(){ ADELANTANDO = null; })   // si falla, se pedirá al hacer clic
      .revCargarTicket(t);
  }

  var d0 = null;          // la ficha que está en pantalla

  function pintar(d){
    d0 = d;
    ESTADO = { ticket:d.ticket, canal:d.canal, veredicto:'', observaciones:'', desacuerdos:{} };
    if (d.revision){ ESTADO.veredicto = d.revision.veredicto; ESTADO.observaciones = d.revision.observaciones; }
    (d.desacuerdos || []).forEach(function(x){
      ESTADO.desacuerdos[x.criterioId] = { criterioId:x.criterioId, veredictoRevisor:x.veredictoRevisor,
                                           tipoError:x.tipoError, comentario:x.comentario };
    });

    var h = [], p = d.puntaje;

    h.push('<div class="tarjeta"><div class="titulo"><h2>' + esc(d.ticket) + '</h2><div class="chips">' +
      '<span class="chip">' + esc(d.canal) + '</span>' +
      (d.agente ? '<span class="chip">' + esc(d.agente) + '</span>' : '') +
      '</div></div>' +
      (d.agenteAuditado
         ? '<p style="font-size:12.5px;color:var(--faint);margin:-4px 0 12px">La nota es de <b>' +
           esc(d.agenteAuditado) + '</b>. Lo que hicieron otras personas del hilo es contexto y ' +
           'no le resta puntos.</p>'
         : '') +
      '<div class="puntaje" style="border:none;padding:0;margin:0">' +
        '<div><div class="nota' + (p.nota === 0 ? ' cero' : '') + '">' + p.nota + '</div>' +
          '<span style="font-size:11px;color:var(--faint)">nota del modelo</span></div>' +
        '<div class="met"><b>' + p.techo + '</b><span>techo alcanzable</span></div>' +
        '<div class="met"><b>' + p.cobertura + '%</b><span>cobertura</span></div>' +
        '<div class="met"><b>' + p.evaluados + ' / ' + p.aplicables + '</b><span>criterios evaluados</span></div>' +
        '<div class="estado"><span class="chip' + (p.nota === 0 ? '' : ' nota') + '">' + esc(p.estado) + '</span></div>' +
        (avisos(p).length ? '<ul class="avisos"><li>' + avisos(p).map(esc).join('</li><li>') + '</li></ul>' : '') +
      '</div></div>');

    // La conversación y el viaje NO vienen con el ticket: son 45.000 caracteres
    // que casi nunca se abren. Se piden solo si la persona los quiere.
    h.push('<div class="extra">' +
      '<button data-carga="conversacion">Ver la conversación</button>' +
      '<button data-carga="viaje">Ver los datos del viaje</button>' +
      '<button class="rehacer" id="rev-rehacer">Borrar esta auditoría</button>' +
      '</div><div id="rev-confirma"></div><div id="rev-extra"></div>');

    h.push('<h3 style="margin:22px 0 10px;font-size:14px;font-weight:650">Veredictos del agente ' +
      '<span style="font-weight:400;color:var(--faint);font-size:12.5px">— marca solo aquellos en los que no estés de acuerdo</span></h3>');

    d.criterios.forEach(function(c){
      var dis = !!ESTADO.desacuerdos[c.criterioId], g = ESTADO.desacuerdos[c.criterioId] || {};
      h.push('<div class="crit' + (dis ? ' dis' : '') + '" id="rev-c-' + esc(c.criterioId) + '">' +
        '<div class="fila">' +
          '<div class="cid">' + esc(c.criterioId) + '</div>' +
          '<div><div class="ctxt">' + esc(c.criterio) +
            (c.afectacion === 'CRITICO' ? '<span class="ccrit">CRÍTICO</span>' : '') + '</div>' +
            (c.cita ? '<div class="cita">' + esc(c.cita) + '</div>' : '') +
            (c.deOtroAutor
               ? '<div class="deotro"><b>No puntúa: el veredicto es sobre ' +
                 esc(c.deOtroAutor) + '</b>, no sobre quien se está auditando. ' +
                 'Si es un incumplimiento real, conviene mirarlo en el ticket de esa persona.</div>'
               : '') +
            (c.noAplicaMotivo
               ? '<div class="nomotivo"><b>No aplica a este ticket:</b> ' + esc(c.noAplicaMotivo) +
                 (c.veredictoOriginal && c.veredictoOriginal !== 'no_aplica'
                    ? '. El evaluador había dicho <b>' + esc(c.veredictoOriginal) +
                      '</b> y no cuenta para la nota.' : '') + '</div>'
               : '') +
            '<div class="cmeta">fuente: ' + esc(c.fuente || '—') + ' · confianza: ' + esc(c.confianza || '—') +
              (c.autor ? ' · evaluó a: ' + esc(c.autor) : '') + '</div></div>' +
          '<div class="acc"><span class="ver v-' + esc(c.veredicto) + '">' + esc(c.veredicto) + '</span>' +
            '<button class="marcar" data-c="' + esc(c.criterioId) + '">' +
            (dis ? 'en desacuerdo' : 'no estoy de acuerdo') + '</button></div>' +
        '</div>' +
        '<div class="detalle"><div class="par">' +
            '<div class="campo"><label>Veredicto correcto</label>' + selVer(g.veredictoRevisor) + '</div>' +
            '<div class="campo"><label>Por qué se equivocó</label>' + selErr(d.tiposError, g.tipoError) + '</div>' +
          '</div><div class="campo"><label>Comentario</label>' +
          '<textarea data-cm="' + esc(c.criterioId) + '" placeholder="Qué debió decir y en qué te basas.">' +
          esc(g.comentario || '') + '</textarea></div></div></div>');
    });

    h.push('<div class="cierre"><label style="display:block;font-size:10.5px;text-transform:uppercase;' +
      'letter-spacing:.06em;color:var(--faint);margin-bottom:8px">La auditoría en conjunto</label><div class="opts">' +
      ['correcta','parcial','incorrecta'].map(function(v){
        return '<button class="opt' + (ESTADO.veredicto === v ? ' on' : '') + '" data-v="' + v + '">' + v + '</button>';
      }).join('') + '</div>' +
      '<div class="campo"><label>Observaciones</label><textarea id="rev-obs" placeholder="Lo que quieras dejar anotado sobre esta auditoría.">' +
      esc(ESTADO.observaciones || '') + '</textarea></div>' +
      '<div class="pie"><button class="btn" id="rev-guardar">Guardar revisión</button>' +
      '<span class="aviso" id="rev-aviso"></span></div></div>');

    $('rev-main').innerHTML = h.join('');
    enlazar();
  }

  function avisos(p){
    return (p.avisos || []).concat(
      p.criticos.length ? ['críticos incumplidos: ' + p.criticos.join(', ')] : [],
      p.porConfirmar.length ? ['críticos por confirmar: ' + p.porConfirmar.join(', ')] : [],
      p.noConcluyentes.length ? [p.noConcluyentes.length + ' criterios no concluyentes: ' +
                                 p.noConcluyentes.join(', ')] : []);
  }

  function cargarExtra(que){
    var caja = $('rev-extra');
    caja.innerHTML = '<div class="cargado"><h4>Cargando…</h4></div>';
    var fn = que === 'viaje' ? 'revViajeDe' : 'revConversacionDe';
    google.script.run.withSuccessHandler(function(r){
      caja.innerHTML = '<div class="cargado"><h4>' +
        (que === 'viaje' ? 'Datos del viaje que usó el agente' : 'Conversación completa') +
        '</h4><pre>' + esc(que === 'viaje' ? r.viaje : r.conversacion) + '</pre></div>';
    }).withFailureHandler(function(e){
      caja.innerHTML = '<div class="cargado"><h4>No pude cargarlo</h4><pre>' + esc(txt(e)) + '</pre></div>';
    })[fn](ACTUAL);
  }
  function selVer(sel){
    return '<select data-vr>' + ['','cumple','no_cumple','no_concluyente','no_aplica'].map(function(v){
      return '<option value="' + v + '"' + (sel === v ? ' selected' : '') + '>' + (v || '— elige —') + '</option>';
    }).join('') + '</select>';
  }
  function selErr(tipos, sel){
    var etq = { regla:'La instrucción estaba mal o era ambigua', dato:'Le faltó información',
                criterio:'Tenía todo y aun así juzgó mal' };
    return '<select data-te>' + [''].concat(tipos || []).map(function(v){
      return '<option value="' + v + '"' + (sel === v ? ' selected' : '') + '>' +
             (v ? (etq[v] || v) : '— elige —') + '</option>';
    }).join('') + '</select>';
  }

  // ---------- interacción ----------
  function enlazar(){
    document.querySelectorAll('#t3 .marcar').forEach(function(b){
      b.onclick = function(){
        var id = b.dataset.c, card = $('rev-c-' + id);
        if (ESTADO.desacuerdos[id]){
          delete ESTADO.desacuerdos[id];
          card.classList.remove('dis'); b.textContent = 'no estoy de acuerdo';
        } else {
          ESTADO.desacuerdos[id] = { criterioId:id, veredictoRevisor:'', tipoError:'', comentario:'' };
          card.classList.add('dis'); b.textContent = 'en desacuerdo';
          var s = card.querySelector('[data-vr]'); if (s) s.focus();
        }
        avisar();
      };
    });
    document.querySelectorAll('#t3 .crit').forEach(function(card){
      var id = card.id.slice(6);   // "rev-c-" son 6 caracteres
      var vr = card.querySelector('[data-vr]'), te = card.querySelector('[data-te]'),
          cm = card.querySelector('[data-cm]');
      function set(){
        if (!ESTADO.desacuerdos[id]) return;
        ESTADO.desacuerdos[id].veredictoRevisor = vr ? vr.value : '';
        ESTADO.desacuerdos[id].tipoError        = te ? te.value : '';
        ESTADO.desacuerdos[id].comentario       = cm ? cm.value : '';
        avisar();
      }
      if (vr) vr.onchange = set;
      if (te) te.onchange = set;
      if (cm) cm.oninput  = set;
    });
    document.querySelectorAll('#t3 .opt').forEach(function(b){
      b.onclick = function(){
        ESTADO.veredicto = b.dataset.v;
        document.querySelectorAll('#t3 .opt').forEach(function(x){ x.classList.remove('on'); });
        b.classList.add('on'); avisar();
      };
    });
    document.querySelectorAll('#t3 .extra button[data-carga]').forEach(function(b){
      b.onclick = function(){ cargarExtra(b.dataset.carga); };
    });
    $('rev-rehacer').onclick = pedirConfirmacion;
    $('rev-obs').oninput = function(){ ESTADO.observaciones = this.value; avisar(); };
    $('rev-guardar').onclick = guardar;
    avisar();
  }

  // ---------- borrar para rehacer ----------
  //
  // Dos pasos a propósito: el primero solo muestra la advertencia. Un botón
  // que borra al primer clic invita a accidentes, y acá borrar significa
  // perder el veredicto de un ticket ya auditado.
  function pedirConfirmacion(){
    var caja = $('rev-confirma');
    caja.innerHTML =
      '<div class="confirmar">' +
        '<span>Se borrarán los veredictos de ' + esc(ACTUAL) + ' y volverá a la cola del paso 2.</span>' +
        '<label><input type="checkbox" id="rev-tambien"> borrar también mi revisión</label>' +
        '<button class="si" id="rev-si">Sí, borrar</button>' +
        '<button id="rev-no">Cancelar</button>' +
      '</div>';
    $('rev-no').onclick = function(){ caja.innerHTML = ''; };
    $('rev-si').onclick = function(){
      var tambien = $('rev-tambien').checked;
      caja.innerHTML = '<div class="confirmar">Borrando…</div>';
      google.script.run.withSuccessHandler(function(r){
        caja.innerHTML = '';
        $('rev-main').innerHTML = '<div class="nada"><b>Auditoría borrada</b>' +
          'El ticket ' + esc(r.ticket) + ' volvió a la cola del paso 2. ' +
          'Vuelve a auditarlo y compara.</div>';
        ACTUAL = null;
        cargar();
        if (window.CONSOLA) window.CONSOLA.refrescarEstado();
      }).withFailureHandler(function(e){
        caja.innerHTML = '<div class="confirmar">No se pudo borrar: ' + esc(txt(e)) + '</div>';
      }).revBorrarAuditoria(ACTUAL, tambien);
    };
  }

  function enlazarBorrarTodo(){
    $('rev-borrar-todo').onclick = function(){
      var caja = $('rev-masivo');
      caja.innerHTML =
        '<div class="confirmar">' +
          '<span>Borra TODAS las auditorías y las devuelve a la cola.</span>' +
          '<label><input type="checkbox" id="rev-todas-rev"> también las revisiones</label>' +
          '<button class="si" id="rev-todo-si">Sí, borrar todo</button>' +
          '<button id="rev-todo-no">Cancelar</button>' +
        '</div>';
      $('rev-todo-no').onclick = restaurarMasivo;
      $('rev-todo-si').onclick = function(){
        var tambien = $('rev-todas-rev').checked;
        caja.innerHTML = '<div class="confirmar">Borrando…</div>';
        google.script.run.withSuccessHandler(function(r){
          restaurarMasivo();
          $('rev-main').innerHTML = '<div class="nada"><b>' + r.tickets + ' auditorías borradas</b>' +
            'Todas volvieron a la cola del paso 2.</div>';
          ACTUAL = null; cargar();
          if (window.CONSOLA) window.CONSOLA.refrescarEstado();
        }).withFailureHandler(function(e){
          restaurarMasivo();
          $('rev-main').innerHTML = '<div class="nada"><b>No se pudo borrar</b>' + esc(txt(e)) + '</div>';
        }).revBorrarTodasLasAuditorias(tambien);
      };
    };
  }

  function restaurarMasivo(){
    $('rev-masivo').innerHTML =
      '<button class="rehacer" id="rev-borrar-todo">Borrar todas las auditorías</button>';
    enlazarBorrarTodo();
  }

  enlazarBorrarTodo();

  function avisar(){
    var claves = Object.keys(ESTADO.desacuerdos), n = claves.length, av = $('rev-aviso');
    if (!av) return;
    var faltan = claves.filter(function(k){
      var g = ESTADO.desacuerdos[k];
      return !g.veredictoRevisor || !String(g.tipoError || '').trim(); });

    av.className = 'aviso';
    if (!ESTADO.veredicto)
      av.textContent = n ? n + ' criterio(s) marcados. Falta el veredicto general.'
                         : 'Sin desacuerdos por ahora. Falta el veredicto general.';
    else if (faltan.length)
      av.textContent = n + ' en desacuerdo · falta completar ' + faltan.join(', ') + '.';
    else
      av.textContent = n + ' criterio(s) en desacuerdo.';
    $('rev-guardar').disabled = !ESTADO.veredicto;
  }

  function guardar(){
    var btn = $('rev-guardar'), av = $('rev-aviso');
    var sinVer = Object.keys(ESTADO.desacuerdos).filter(function(k){
      return !ESTADO.desacuerdos[k].veredictoRevisor; });
    if (sinVer.length){
      av.className = 'aviso err';
      av.textContent = 'Falta el veredicto correcto en: ' + sinVer.join(', ');
      return;
    }
    // Afirmar un incumplimiento exige decir en qué te basas. Absolver, no.
    var sinPorque = Object.keys(ESTADO.desacuerdos).filter(function(k){
      var g = ESTADO.desacuerdos[k];
      return g.veredictoRevisor === 'no_cumple' && !String(g.comentario || '').trim(); });
    if (sinPorque.length){
      av.className = 'aviso err';
      av.textContent = 'Marcaste no_cumple sin explicar en qué te basas: ' + sinPorque.join(', ');
      return;
    }
    // El tipo decide qué se arregla después: regla, integración o calibración.
    // Se comprueba acá además del servidor para no perder lo escrito en un
    // error que se ve venir.
    var sinTipo = Object.keys(ESTADO.desacuerdos).filter(function(k){
      return !String(ESTADO.desacuerdos[k].tipoError || '').trim(); });
    if (sinTipo.length){
      av.className = 'aviso err';
      av.textContent = 'Falta decir por qué se equivocó en: ' + sinTipo.join(', ') +
                       '. Es lo que dice si hay que corregir la regla, integrar un dato o ' +
                       'calibrar el criterio con ejemplos.';
      return;
    }

    btn.disabled = true; av.className = 'aviso'; av.textContent = 'Guardando…';
    google.script.run.withSuccessHandler(function(r){
      av.className = 'aviso ok';
      av.textContent = 'Guardado. Nota del modelo ' + (r.notaModelo === null ? '—' : r.notaModelo) +
                       ' → corregida ' + r.notaCorregida + '.';
      btn.disabled = false;

      // La lista se actualiza ACÁ, sin volver a pedirla. Todo lo que cambia
      // —que el ticket pasa a revisado, con qué veredicto y cuántos
      // desacuerdos— ya lo sabemos: acabamos de escribirlo. Pedir la lista
      // entera de vuelta era medio segundo de espera para enterarnos de algo
      // que teníamos en la mano.
      var n = Object.keys(ESTADO.desacuerdos).length;
      for (var i = 0; i < TICKETS.length; i++){
        if (TICKETS[i].ticket !== ESTADO.ticket) continue;
        TICKETS[i].revisado = true;
        TICKETS[i].veredictoRevisor = ESTADO.veredicto;
        TICKETS[i].desacuerdos = n;
        TICKETS[i].criteriosRevisados = (d0 && d0.criterios) ? d0.criterios.length : 0;
        break;
      }
      olvidarDeCache(ESTADO.ticket);      // la próxima vez que se abra, se lee de nuevo
      pintarLista();
      resumen();                          // el ranking sí sale del servidor, y no bloquea
      if (window.CONSOLA) window.CONSOLA.refrescarEstado();
    }).withFailureHandler(function(e){
      btn.disabled = false;
      av.className = 'aviso err'; av.textContent = txt(e);
    }).revGuardar({
      ticket: ESTADO.ticket, canal: ESTADO.canal,
      veredicto: ESTADO.veredicto, observaciones: ESTADO.observaciones,
      desacuerdos: Object.keys(ESTADO.desacuerdos).map(function(k){ return ESTADO.desacuerdos[k]; }),
    });
  }

  // La consola llama a esto cuando se abre la pestaña.
  window.REVISION = {
    init: function(){
      // Hereda el filtro de la cabecera la primera vez y cada vez que se
      // vuelve a la pestaña: es una sola consola, no tres pantallas sueltas.
      if (window.CONSOLA && window.CONSOLA.audiencia) {
        var g = window.CONSOLA.audiencia();
        if (g !== undefined && g !== AUD) { AUD = g; if (CARGADO) { armarSelectores(); pintarLista(); } }
      }
      if (!CARGADO) cargar(); else resumen();
    },
    recargar: function(){ cargar(); },
  };
})();
</script>
